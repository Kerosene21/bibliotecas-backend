spring.application.name=bibliotecas-backend
spring.config.import=optional:file:./.env[.properties]

server.port=${SERVER_PORT:8086}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:bibliotecas}
spring.datasource.username=${DB_USER:bibliotecas}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
